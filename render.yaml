# Blueprint de Render: base de datos + API + frontend en el plan gratuito.
# Uso: en Render, "New" → "Blueprint" → seleccionar este repositorio.
databases:
  - name: biblioteca-db
    plan: free
    databaseName: biblioteca
    user: biblioteca

services:
  - type: web
    name: biblioteca-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase: { name: biblioteca-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: biblioteca-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: biblioteca-db, property: database }
      - key: DB_USER
        fromDatabase: { name: biblioteca-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: biblioteca-db, property: password }
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: biblioteca-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # El frontend llama a /api; se reenvía a la API. Si Render le asigna otra URL a la API, cámbiala aquí.
      - type: rewrite
        source: /api/*
        destination: https://biblioteca-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
