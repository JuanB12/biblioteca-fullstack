<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; background:#f4f5f7; margin:0; padding:24px;">
  <table role="presentation" width="100%" style="max-width:520px; margin:0 auto; background:#ffffff; border-radius:8px; overflow:hidden;">
    <tr><td style="background:#c98a1a; padding:20px 24px;">
      <h1 style="color:#ffffff; font-size:18px; margin:0;">Biblioteca — Tu prestamo vence pronto</h1>
    </td></tr>
    <tr><td style="padding:24px; color:#222;">
      <p>Hola <strong th:text="${borrowerName}">Nombre</strong>,</p>
      <p>Te recordamos que el siguiente prestamo esta por vencer:</p>
      <table role="presentation" style="width:100%; border-collapse:collapse; margin:16px 0;">
        <tr><td style="padding:6px 0; color:#666;">Libro</td><td style="padding:6px 0; font-weight:bold;" th:text="${bookTitle}">Titulo</td></tr>
        <tr><td style="padding:6px 0; color:#666;">Fecha limite</td><td style="padding:6px 0; font-weight:bold; color:#c98a1a;" th:text="${dueDate}">15/01/2026</td></tr>
      </table>
      <p style="color:#666; font-size:13px;">Devuelvelo a tiempo para evitar que se registre un atraso en tu cuenta.</p>
    </td></tr>
  </table>
</body>
</html>
