spring:
  application:
    name: biblioteca
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    cache: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:biblioteca@biblioteca.local}
  loan:
    default-duration-days: 14
    reminder-days-before-due: 2
    max-overdue-count: 3
    overdue-window-days: 90
    block-duration-days: 7
  openlibrary:
    base-url: ${OPENLIBRARY_BASE_URL:https://openlibrary.org}
    covers-url: ${OPENLIBRARY_COVERS_URL:https://covers.openlibrary.org}
    timeout-seconds: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.juanbarrios.biblioteca: DEBUG

---
spring:
  config:
    activate:
      on-profile: local

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:biblioteca}
  mail:
    host: mailhog
    port: 1025
